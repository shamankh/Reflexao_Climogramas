<script>

const scriptURL = 'https://script.google.com/macros/s/AKfycbx-tdSaimOntliI8qkoUTjo5LTo3ocZSIUxtfoCQBxJIKCMGHoDfrTr9JxqweSaT7o/exec';

let opiniao = "";

function sel(valor, elemento){

    opiniao = valor;

    document.querySelectorAll('.card').forEach(card=>{
        card.classList.remove('active');
    });

    elemento.classList.add('active');

    document.getElementById('fill').style.width = '60%';
}

document.getElementById('just').addEventListener('input', function(){

    const total = this.value.length;

    document.getElementById('cnt').innerText = total;

    if(total >= 80){
        document.getElementById('fill').style.width = '100%';
    }

});

function enviar(){

    const nome = document.getElementById('nome').value.trim();
    const turma = document.getElementById('turma').value;
    const justificativa = document.getElementById('just').value.trim();

    if(nome === ""){
        alert("Informe seu nome.");
        return;
    }

    if(turma === ""){
        alert("Selecione a turma.");
        return;
    }

    if(opiniao === ""){
        alert("Escolha Concordo ou Discordo.");
        return;
    }

    if(justificativa.length < 80){
        alert("A justificativa deve possuir pelo menos 80 caracteres.");
        return;
    }

    const btn = document.getElementById('btnEnviar');

    btn.disabled = true;
    btn.innerHTML = "⏳ Enviando...";

    const dados = new FormData();

    dados.append("Nome", nome);
    dados.append("Turma", turma);
    dados.append("Opinião", opiniao);
    dados.append("Justificativa", justificativa);

    fetch(scriptURL,{
        method:'POST',
        body:dados
    })
    .then(response => response.text())
    .then(() => {

        document.getElementById('form').style.display = 'none';
        document.getElementById('ok').style.display = 'block';

    })
    .catch(error => {

        console.error(error);

        alert("Erro ao enviar os dados para a planilha.");

        btn.disabled = false;
        btn.innerHTML = "🚀 Enviar Reflexão";

    });

}

</script>

</body>
</html>
